name: dryforge verify

# Runs the Dryforge fork's own verification (build guards + reproducible build).
# The upstream workflow lives in dryforge/.github/ and does not run from a subdirectory,
# so this root workflow runs the same checks with dryforge/ as the working directory.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dryforge-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify package
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dryforge
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Check shell scripts
        run: shellcheck build/build.sh

      - name: Verify build and manifests
        run: python3 ci/verify.py

      - name: Check root marketplace points at the built package
        working-directory: .
        run: |
          python3 - <<'PY'
          import json, pathlib, sys
          root = json.loads(pathlib.Path(".claude-plugin/marketplace.json").read_text())
          inner = json.loads(pathlib.Path("dryforge/platform/claude/plugin.json").read_text())
          entry = root["plugins"][0]
          target = pathlib.Path(entry["source"].removeprefix("./"))
          errors = []
          if entry["name"] != inner["name"]:
              errors.append(f"plugin name {entry['name']} != {inner['name']}")
          if not (target / ".claude-plugin/plugin.json").is_file():
              errors.append(f"source {entry['source']} is not a built Claude package")
          if errors:
              print("\n".join(errors)); sys.exit(1)
          print("OK root marketplace")
          PY
